LABEL existing
TEXT HELP
Demarre un systeme deja installe.
TAB pour modifier le disque et la partition a demarrer.
ENDTEXT
MENU LABEL Demarrer le systeme installe
COM32 chain.c32
APPEND hd0 0

# http://www.memtest.org/
LABEL memtest
MENU LABEL Memtest86+ (test de la memoire)
LINUX /%INSTALL_DIR%/boot/memtest

# http://hdt-project.org/
LABEL hdt
MENU LABEL Informations sur le materiel (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
TEXT HELP
Redemarre l'ordinateur.
Le firmware de l'ordinateur doit prendre en charge APM.
ENDTEXT
MENU LABEL Redemarrer
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Eteint l'ordinateur.
Le firmware de l'ordinateur doit prendre en charge APM.
ENDTEXT
MENU LABEL Eteindre
COM32 poweroff.c32
