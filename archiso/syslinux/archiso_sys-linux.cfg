LABEL cos64
TEXT HELP
Boot the Packarch install medium on BIOS.
It allows you to install Packarch or perform system maintenance.
ENDTEXT
MENU LABEL Packarch default (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

# Copy to RAM / no copy to RAM (default: copytoram=auto, copied when the
# memory is large enough)
LABEL cos64ram
TEXT HELP
Boot the Packarch install medium on BIOS, copied to RAM:
slower boot, then the USB key can be removed.
ENDTEXT
MENU LABEL Packarch copy to RAM (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=y module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

LABEL cos64noram
TEXT HELP
Boot the Packarch install medium on BIOS, without copying it to RAM:
faster boot, the USB key must stay plugged in.
ENDTEXT
MENU LABEL Packarch no copy to RAM (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

# Fallback (nomodeset)
LABEL cos64fb
TEXT HELP
Boot the Packarch install medium on Bios in fallback mode
It allows you to install Packarch or perform system maintenance.
ENDTEXT
MENU LABEL Packarch Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
