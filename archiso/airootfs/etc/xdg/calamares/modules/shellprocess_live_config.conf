#
# Online installation of the XFCE live ISO: once the packages are installed,
# copy the settings of the live ISO that are not packaged to the target
# (shells, Geany, passwordless sudo, GitHub setup; the others come
# from packarch-xfce-settings or packarch-openbox-settings and packarch-system-settings)
# and remove the local repository of the ISO from the target (attached by
# shellprocess@before-online). The scripts are shipped by the ISO (airootfs).
---
i18n:
    name: "Copying the settings of the live system"
    name[fr]: "Copie des réglages du système live"
dontChroot: true
timeout: 1800
script:
    - command: "/usr/local/bin/apply-live-config ${ROOT} ${USER}"
      verbose: true
