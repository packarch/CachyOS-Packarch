#
# Packages of the online installation (Packarch), installed after
# pacstrap. The options are those of CachyOS (packages_online.conf of
# cachyos-calamares-next); the operations below were the hidden groups of the
# former netinstall@live page (Packarch has no "Additional packages" page any
# more: optional software is installed after the installation with the
# Packarch Installer, packarch-pi). The packages of the chosen desktop
# are added by packagechooser@desktop (packagechooser_desktop.conf).
---
backend: pacman
skip_if_no_internet: false
update_db: true
update_system: true
pacman:
    num_retries: 6
    disable_download_timeout: true
    needed_only: true

operations:
  # CachyOS required packages
  - install:
      - cachyos-hooks
      - cachyos-keyring
      - cachyos-mirrorlist
      - cachyos-v3-mirrorlist
      - cachyos-v4-mirrorlist
      - cachyos-rate-mirrors
      - chwd
  # CachyOS kernels
  - install:
      - linux-cachyos
      - linux-cachyos-headers
      - amd-ucode
      - intel-ucode
  # CachyOS tools
  - install:
      # CachyOS Hello forked for Packarch (Packarch repository)
      - packarch-hello
      - cachyos-kernel-manager
      # CachyOS Package Installer forked for Packarch (Packarch repository)
      - packarch-pi
      - cachyos-settings
      - cachyos-wallpapers
      # cachyos-zsh-config without vim (Packarch repository)
      - packarch-zsh-config
      # Remote help by Tailscale SSH, inactive until the user allows it
      # (Packarch repository)
      - packarch-depannage
  # Base system: network, firewall, bluetooth, audio, fonts, hardware and common tools
  - install:
      # Network
      - dnsmasq
      - dnsutils
      - ethtool
      - iwd
      - modemmanager
      - networkmanager
      - networkmanager-openvpn
      - nss-mdns
      - usb_modeswitch
      - wpa_supplicant
      - wireless-regdb
      - xl2tpd
      # Firewall
      - ufw
      - ufw-extras
      # Bluetooth
      - bluez
      - bluez-hid2hci
      - bluez-libs
      - bluez-utils
      - bluez-obex
      # Package management
      - pacman-contrib
      - pkgfile
      - rebuild-detector
      - reflector
      - shelly
      - yay
      - paru
      # Desktop integration
      - accountsservice
      - bash-completion
      - ffmpegthumbnailer
      - gst-libav
      - gst-plugin-pipewire
      - gst-plugins-bad
      - gst-plugins-ugly
      - libdvdcss
      - libgsf
      - libopenraw
      - plocate
      - poppler-glib
      - xdg-user-dirs
      - xdg-utils
      # Filesystems
      - efitools
      - nfs-utils
      - nilfs-utils
      - ntfs-3g
      - smartmontools
      - unrar
      - unzip
      # Fonts
      - awesome-terminal-fonts
      - noto-fonts-emoji
      - cantarell-fonts
      - noto-fonts
      - noto-fonts-cjk
      - ttf-bitstream-vera
      - ttf-dejavu
      - ttf-liberation
      - ttf-opensans
      - ttf-meslo-nerd
      - ttf-jetbrains-mono-nerd
      # Audio
      - alsa-firmware
      - alsa-plugins
      - alsa-utils
      - pipewire-pulse
      - wireplumber
      - pipewire-alsa
      - realtime-privileges
      # Hardware
      - dmidecode
      - dmraid
      - hdparm
      - hwdetect
      - hwinfo
      - inxi
      - linux-firmware
      - lsscsi
      - mesa-utils
      - mtools
      - sg3_utils
      - sof-firmware
      # Power
      - cpupower
      - power-profiles-daemon
      - upower
      # Tools (no alacritty/micro/vim/ranger: only nano and geany as editors)
      - htop
      - duf
      - fsarchiver
      - git
      - glances
      - fastfetch
      - nano
      - nano-syntax-highlighting
      - pv
      - python-defusedxml
      - python-packaging
      - rsync
      - wget
      - ripgrep
      - openssh
  # The display manager, the applications and the themes of the live ISO, for both desktops
  - install:
      - lightdm
      - lightdm-gtk-greeter
      - lightdm-gtk-greeter-settings
      # Packarch repository: LightDM greeter and numeric keypad, no screen
      # blanking, pacman hooks (Geany, entries hidden from the menus)
      - packarch-system-settings
      # Packarch repository: the icon themes and wallpapers of the themes of
      # packarch-skin (both desktops) and of the LightDM greeter. The GTK
      # themes (packarch-themes) come with the desktop package, the greeter
      # has its own (packarch-system-settings).
      - packarch-backgrounds
      - packarch-icons
      # Qogir icons and Qogir-Dark cursor (desktop and greeter; also a
      # dependency of packarch-icons)
      - qogir-icon-theme
      - xorg-server
      - xorg-xrandr
      - xf86-input-libinput
      - xdg-user-dirs-gtk
      - network-manager-applet
      - blueman
      - pavucontrol
      - polkit-gnome
      - gvfs
      - gvfs-mtp
      - gvfs-smb
      - file-roller
      - xarchiver
      - catfish
      - meld
      - geany
      - cachyos-grub-theme
      # Papirus-Dark, inherited by the icon themes
      - papirus-icon-theme
      # Packarch repository: applications of the author
      - cryptyrust
      # Password dialog of github-setup (first login)
      - zenity
      - liloucalc
      - nounours-player
      - packarch-rmatrix
      - firefox
      - firefox-i18n-$LOCALE
