# SPDX-License-Identifier: CC0-1.0
#
# Online installation: pacman.conf, resolv.conf and the mirror lists are written
# to the target before pacstrap (shellprocess@initialize_pacman and
# shellprocess@before-online), so pacman sets the packaged versions aside as
# .pacnew. They are unmodified defaults (pacman.conf.pacnew has neither the
# CachyOS repositories nor [packarch]), not updates to merge. Only these files
# are removed: any other .pacnew would be unexpected and stays visible.
---
i18n:
    name: "Removing the unused default configuration files"
dontChroot: false
timeout: 10
script:
    - "rm -f /etc/pacman.conf.pacnew /etc/resolv.conf.pacnew /etc/pacman.d/mirrorlist.pacnew /etc/pacman.d/cachyos-mirrorlist.pacnew /etc/pacman.d/cachyos-v3-mirrorlist.pacnew /etc/pacman.d/cachyos-v4-mirrorlist.pacnew"
