# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Desktop of the online installation (Packarch): the XFCE desktop of
# the live ISO or the Openbox desktop of Packarch (packarch-openbox-settings). The
# packages of the chosen item are added to those of packages@online
# (packages_online.conf), installed after pacstrap; the settings of that
# desktop are copied by shellprocess@live_config (apply-live-config).
---
mode: required
method: packages
labels:
    step: "Desktop"
    step[fr]: "Bureau"
default: XFCE
items:
    - id: XFCE
      name: "XFCE"
      description: "The desktop of the live ISO: XFCE with its theme switcher, its panel and its settings."
      description[fr]: "Le bureau du live : XFCE avec son sélecteur de thèmes, son panneau et ses réglages."
      screenshot: "/etc/calamares/images/xfce.jxl"
      packages:
        # Packarch repository: settings in /etc/skel and theme switcher
        - packarch-xfce-settings
        - xfce4
        - xfce4-battery-plugin
        - xfce4-clipman-plugin
        - xfce4-cpufreq-plugin
        - xfce4-cpugraph-plugin
        - xfce4-dict
        - xfce4-diskperf-plugin
        - xfce4-eyes-plugin
        - xfce4-fsguard-plugin
        - xfce4-genmon-plugin
        - xfce4-mailwatch-plugin
        - xfce4-mount-plugin
        - xfce4-netload-plugin
        - xfce4-notes-plugin
        - xfce4-notifyd
        - xfce4-places-plugin
        - xfce4-pulseaudio-plugin
        - xfce4-screensaver
        - xfce4-screenshooter
        - xfce4-smartbookmark-plugin
        - xfce4-systemload-plugin
        - xfce4-taskmanager
        - xfce4-time-out-plugin
        - xfce4-timer-plugin
        - xfce4-verve-plugin
        - xfce4-wavelan-plugin
        - xfce4-weather-plugin
        - xfce4-whiskermenu-plugin
        - xfce4-xkb-plugin
        - thunar-archive-plugin
        - thunar-media-tags-plugin
        - ristretto
    - id: Openbox
      name: "Openbox"
      description: "The Openbox desktop of Packarch: polybar, rofi menus, dunst notifications, kitty terminal and 10 themes, switched from the desktop menu."
      description[fr]: "Le bureau Openbox de Packarch : polybar, menus rofi, notifications dunst, terminal kitty et 10 thèmes, à changer depuis le menu du bureau."
      screenshot: "/etc/calamares/images/openbox.jxl"
      packages:
        # Packarch repository, like its dependencies (themes, skin chooser,
        # cursors, fonts, AUR packages)
        - packarch-openbox-settings
        - thunar-archive-plugin
        - thunar-media-tags-plugin
        - thunar-volman
        - tumbler
